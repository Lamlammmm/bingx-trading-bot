services:
  trading-bot:
    build: .
    restart: unless-stopped
    environment:
      TRADINGBOT__BINGX__SYMBOL: ${TRADINGBOT__BINGX__SYMBOL:-BTC-USDT}
      TRADINGBOT__BINGX__HISTORYLIMIT: ${TRADINGBOT__BINGX__HISTORYLIMIT:-250}
      TRADINGBOT__RISK__STARTINGBALANCE: ${TRADINGBOT__RISK__STARTINGBALANCE:-10000}
      TRADINGBOT__RISK__RISKPERTRADEPERCENT: ${TRADINGBOT__RISK__RISKPERTRADEPERCENT:-0.5}
      TRADINGBOT__RISK__MAXDAILYLOSSPERCENT: ${TRADINGBOT__RISK__MAXDAILYLOSSPERCENT:-2}
      TRADINGBOT__RISK__MAXLEVERAGE: ${TRADINGBOT__RISK__MAXLEVERAGE:-3}
      TRADINGBOT__OPENAI__ENABLED: ${TRADINGBOT__OPENAI__ENABLED:-false}
      TRADINGBOT__OPENAI__MODEL: ${TRADINGBOT__OPENAI__MODEL:-gpt-5.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BINGX_API_KEY: ${BINGX_API_KEY:-}
      BINGX_API_SECRET: ${BINGX_API_SECRET:-}
