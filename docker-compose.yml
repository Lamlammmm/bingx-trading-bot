services:
  trading-bot:
    build: .
    restart: unless-stopped
    environment:
      BINGX__SYMBOLS__0: ${BINGX__SYMBOLS__0:-BTC-USDT}
      BINGX__SYMBOLS__1: ${BINGX__SYMBOLS__1:-}
      BINGX__SYMBOLS__2: ${BINGX__SYMBOLS__2:-}
      BINGX__HISTORYLIMIT: ${BINGX__HISTORYLIMIT:-250}
      RISK__STARTINGBALANCE: ${RISK__STARTINGBALANCE:-10000}
      RISK__RISKPERTRADEPERCENT: ${RISK__RISKPERTRADEPERCENT:-0.5}
      RISK__MAXDAILYLOSSPERCENT: ${RISK__MAXDAILYLOSSPERCENT:-2}
      RISK__MAXLEVERAGE: ${RISK__MAXLEVERAGE:-3}
      OPENAI__ENABLED: ${OPENAI__ENABLED:-false}
      OPENAI__MODEL: ${OPENAI__MODEL:-gpt-5.2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BINGX_API_KEY: ${BINGX_API_KEY:-}
      BINGX_API_SECRET: ${BINGX_API_SECRET:-}
