purpose:
  stands_in_for: BingX signed USDT Hedge position/order/income responses and controlled management failures.
  unblocks: Run the production LiveTradingEngine and BingXLiveExecutor over real local HTTP without exchange credentials.
assumptions:
  - id: managed-partial-and-protection
    status: supported
    claim: The caller confirms a partial market fill and exact remaining position before replacing the saved SL/TP IDs with STOP_ON_FAILURE.
    reason: The mock follows official BingX API reference fields; the race/failure injections are synthetic. Owner mock lookup was skipped because Postman CLI is signed out and status is unsupported.
    verification: >-
      On 2026-11-06 eight HTTP scenarios passed with the production executor and Live engine on localhost.
      They covered LONG/SHORT staged partials and restart deduplication, close timeout after write, partial fill,
      stop timeout, TP rejection, confirmed SL cancellation and replacement failure with emergency close, and an unknown manual order.
      Control state and 242 simulation requests confirmed the modeled calls. A separate unit test covers database outage
      during emergency protection. On 2026-11-08 all eight scenarios passed again with MACD enabled and only 70 initial
      closed candles, below the default warm-up of 130. The macd-management-20261108 loopback run recorded 242 requests.
      Both runs used synthetic credentials. Live exchange fills, races and idempotency retention remain unverified.
      The 2026-11-21 Release readiness run passed all eight scenarios again with the v3 account margin fields.
      The local simulator recorded 246 requests including the separate four-request empty-income pass.
      On 2026-11-26 the Release loopback smoke passed all eight scenarios again. Logs showed synthetic order,
      position and income requests, including the unknown manual order response.
    source: src/TradingBot.Worker/Infrastructure/Live/LiveTradingEngine.Advanced.cs; src/TradingBot.Worker/Infrastructure/BingX/BingXLiveExecutor.Management.cs; tests/TradingBot.ExecutionSmoke/LiveManagementSmoke.cs
    updated_at: "2026-11-26"
  - id: successful-empty-income-is-null
    status: supported
    claim: BingX returned HTTP 200 with code 0, an empty message and a null data field for two historical account income queries without ledger rows.
    reason: >-
      In the 2026-11-21 audit, GET /openApi/swap/v2/user/income for UTC midnight through the two Live signals on 2026-11-15
      returned explicit null. The control window 2026-11-05 through 2026-11-06 returned an array with six records.
      The official BingX reference shows an array when rows are present and has no example for the empty ledger.
    verification: >-
      The empty-income-20261121 loopback smoke ran the production executor with synthetic keys.
      Simulation output showed reset, balance GET, income GET with code 0 and data null, and commission GET.
      The snapshot preserved equity and commission and reported zero cash flows. Unit tests also reject missing or
      malformed data and nonzero exchange codes.
      The follow-up run on 2026-11-21 reproduced the three read-only calls on loopback with synthetic keys.
      A separate xUnit test used the real parser with an in-process HTTP fixture and the approved-policy Live engine
      with a synthetic exchange. It verified continued enforcement of daily loss and margin/size checks,
      and refusal to reconcile a closed position without realized PnL and trading fee records.
      The Release readiness smoke also asserted used margin, frozen margin and available margin alongside the empty ledger.
      The 2026-11-26 loopback run again passed `--empty-income`, with balance, income and commission requests.
      A separate read-only BingX query returned HTTP 200/code 0 with explicit null income for the 2026-11-21 UTC incident day.
    source: docs/trading-pipeline-audit.md; src/TradingBot.Worker/Infrastructure/BingX/BingXLiveExecutor.Management.cs; tests/TradingBot.ExecutionSmoke/Program.cs; tests/TradingBot.Tests/BingXLiveExecutorTests.cs; tests/TradingBot.Tests/LivePositionManagementTests.cs
    updated_at: "2026-11-26"
